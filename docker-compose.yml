services:

  postgres:
    image: postgres:15-alpine
    container_name: cortex_postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: cortex
      POSTGRES_PASSWORD: cortex
      POSTGRES_DB: cortex

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cortex -d cortex"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - cortex_network

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: cortex_redis
    restart: unless-stopped

    command: redis-server --appendonly yes

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - cortex_network

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  qdrant:
    image: qdrant/qdrant:v1.15.0
    container_name: cortex_qdrant
    restart: unless-stopped

    ports:
      - "6333:6333"
      - "6334:6334"

    volumes:
      - qdrant_storage:/qdrant/storage

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5

    networks:
      - cortex_network

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: cortex_backend
    restart: unless-stopped

    env_file:
      - .env

    environment:
      DATABASE_URL: postgresql+psycopg2://cortex:cortex@postgres:5432/cortex
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333

      GROQ_API_KEY: ${GROQ_API_KEY}

      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30

      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy

    ports:
      - "8000:8000"

    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads

    working_dir: /app

    command: >
      sh -c "
      alembic upgrade head &&
      uvicorn main:app
      --host 0.0.0.0
      --port 8000
      --reload
      "

    networks:
      - cortex_network

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: cortex_celery_worker
    restart: unless-stopped

    env_file:
      - .env

    environment:
      DATABASE_URL: postgresql+psycopg2://cortex:cortex@postgres:5432/cortex
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333

      GROQ_API_KEY: ${GROQ_API_KEY}

      SECRET_KEY: ${SECRET_KEY}

      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy

    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads

    working_dir: /app

    command: >
      celery
      -A app.core.celery_app
      worker
      --loglevel=info
      --pool=solo

    networks:
      - cortex_network

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
  redis_data:
  qdrant_storage:
  uploads_data:

networks:
  cortex_network:
    driver: bridge